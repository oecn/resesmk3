<section class="auth-login-wrap">
  <section class="auth-card auth-card-mobile">
    <form class="auth-form" (ngSubmit)="submit()">
      <div class="auth-heading">
        <h1>Iniciar sesion</h1>
        <p class="subtitle">Ingresa con tu usuario del sistema para operar el dashboard.</p>
      </div>
      <label>
        Usuario
        <input
          type="text"
          name="loginUsername"
          [ngModel]="username"
          (ngModelChange)="onUsernameChange($event)"
          autocomplete="username"
          placeholder="Usuario">
      </label>
      <label>
        <span class="auth-label-row">
          <span>Password</span>
        </span>
        <input
          type="password"
          name="loginPassword"
          [ngModel]="password"
          (ngModelChange)="onPasswordChange($event)"
          autocomplete="current-password"
          placeholder="Password">
      </label>
      <button type="submit" [disabled]="loading">Entrar</button>
    </form>
    <p *ngIf="error" class="alert">{{ error }}</p>
  </section>
</section>
