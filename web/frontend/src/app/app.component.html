<main *ngIf="authLoading()" class="auth-shell" [class.dark-mode]="darkMode">
  <section class="auth-card">
    <p class="eyebrow">Verificando sesion</p>
    <h1>Control de Reces</h1>
    <p class="subtitle">Conectando con el servidor y validando acceso.</p>
  </section>
</main>

<router-outlet *ngIf="!authLoading() && !currentUser()"></router-outlet>

<app-shell *ngIf="!authLoading() && currentUser()"></app-shell>
